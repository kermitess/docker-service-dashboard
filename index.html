<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Server Services</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f3f2ee;
        --bg-accent: #dde6dd;
        --surface: rgba(255, 255, 255, 0.84);
        --surface-strong: rgba(255, 255, 255, 0.96);
        --text: #18211d;
        --muted: #5f6c64;
        --line: rgba(24, 33, 29, 0.1);
        --line-strong: rgba(24, 33, 29, 0.16);
        --brand: #1c6b4a;
        --brand-strong: #135238;
        --radius-lg: 24px;
        --radius-md: 18px;
        --radius-sm: 12px;
        --shadow: 0 20px 50px rgba(27, 39, 31, 0.08);
        --bg-end: #f8f7f4;
        --pill-bg: rgba(255, 255, 255, 0.65);
        --card-shadow: 0 14px 36px rgba(27, 39, 31, 0.06);
        --port-bg: rgba(28, 107, 74, 0.08);
        --button-text: #fff;
        --link-shadow: 0 10px 24px rgba(19, 82, 56, 0.18);
        --error-line: rgba(150, 49, 49, 0.18);
        --font-sans: "IBM Plex Sans", "Avenir Next", "Segoe UI", sans-serif;
        --font-mono: "IBM Plex Mono", "SFMono-Regular", "Consolas", monospace;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1412;
          --bg-accent: #16201b;
          --bg-end: #0f1412;
          --surface: rgba(18, 24, 21, 0.84);
          --surface-strong: rgba(24, 31, 27, 0.94);
          --text: #edf3ee;
          --muted: #a6b5ab;
          --line: rgba(237, 243, 238, 0.1);
          --line-strong: rgba(237, 243, 238, 0.18);
          --brand: #5db587;
          --brand-strong: #79c79a;
          --shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
          --pill-bg: rgba(255, 255, 255, 0.08);
          --card-shadow: 0 14px 36px rgba(0, 0, 0, 0.25);
          --port-bg: rgba(93, 181, 135, 0.12);
          --button-text: #0f1412;
          --link-shadow: 0 10px 24px rgba(0, 0, 0, 0.3);
          --error-line: rgba(231, 111, 111, 0.22);
        }
      }

      * {
        box-sizing: border-box;
      }

      html {
        background:
          radial-gradient(circle at top left, rgba(28, 107, 74, 0.12), transparent 28%),
          linear-gradient(180deg, var(--bg-accent) 0%, var(--bg) 18%, var(--bg-end) 100%);
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: var(--font-sans);
        color: var(--text);
        background: transparent;
      }

      .wrap {
        width: min(1120px, calc(100% - 28px));
        margin: 0 auto;
        padding: 20px 0 40px;
      }

      .hero {
        display: grid;
        gap: 18px;
        margin-bottom: 18px;
        padding: 20px 22px;
        border: 1px solid var(--line);
        border-radius: calc(var(--radius-lg) + 4px);
        background: linear-gradient(180deg, var(--surface-strong), var(--surface));
        box-shadow: var(--shadow);
        backdrop-filter: blur(14px);
      }

      .hero-top {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 20px;
        flex-wrap: wrap;
      }

      .eyebrow,
      .stat {
        display: inline-flex;
        align-items: center;
        min-height: 34px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--pill-bg);
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(1.8rem, 4vw, 3rem);
        line-height: 0.94;
        letter-spacing: -0.04em;
      }

      .subtitle {
        margin: 0;
        max-width: 40rem;
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.45;
      }

      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .search-wrap {
        position: relative;
        margin-bottom: 18px;
      }

      .search-wrap svg {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--muted);
        pointer-events: none;
      }

      .search-input {
        width: 100%;
        padding: 10px 14px 10px 40px;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: var(--pill-bg);
        color: var(--text);
        font: inherit;
        font-size: 0.92rem;
        outline: none;
        transition: border-color 150ms ease, box-shadow 150ms ease;
      }

      .search-input::placeholder {
        color: var(--muted);
        opacity: 0.7;
      }

      .search-input:focus {
        border-color: var(--brand);
        box-shadow: 0 0 0 3px rgba(28, 107, 74, 0.12);
      }

      @media (prefers-color-scheme: dark) {
        .search-input:focus {
          box-shadow: 0 0 0 3px rgba(93, 181, 135, 0.15);
        }
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 14px;
      }

      .card {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: linear-gradient(180deg, var(--surface-strong), var(--surface));
        box-shadow: var(--card-shadow);
        backdrop-filter: blur(14px);
      }

      .card h2 {
        margin: 0;
        font-size: 1.05rem;
        line-height: 1.1;
        letter-spacing: -0.03em;
      }

      .card-header {
        display: grid;
        gap: 6px;
      }

      .port {
        width: fit-content;
        padding: 5px 9px;
        border-radius: var(--radius-sm);
        background: var(--port-bg);
        color: var(--brand-strong);
        font: 600 0.78rem/1 var(--font-mono);
      }

      .meta,
      .description,
      .card-link {
        margin: 0;
        color: var(--muted);
      }

      .meta {
        font-size: 0.84rem;
        letter-spacing: 0.01em;
      }

      .host {
        color: var(--text);
        opacity: 0.72;
      }

      .meta + .meta {
        margin-top: -2px;
      }

      .image {
        display: -webkit-box;
        overflow: hidden;
        word-break: break-word;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .description {
        line-height: 1.4;
      }

      .link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: fit-content;
        min-height: 36px;
        padding: 0 14px;
        border: 1px solid transparent;
        border-radius: 999px;
        background: var(--brand);
        color: var(--button-text);
        text-decoration: none;
        font-size: 0.92rem;
        font-weight: 700;
        transition:
          transform 120ms ease,
          background-color 120ms ease,
          box-shadow 120ms ease;
      }

      .link:hover,
      .link:focus-visible {
        background: var(--brand-strong);
        box-shadow: var(--link-shadow);
        transform: translateY(-1px) scale(1.01);
      }

      .empty,
      .error {
        padding: 22px;
        border-radius: var(--radius-md);
        background: linear-gradient(180deg, var(--surface-strong), var(--surface));
        border: 1px solid var(--line);
        color: var(--muted);
        box-shadow: var(--shadow);
      }

      .error {
        border-color: var(--error-line);
      }

      @keyframes cardIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .card,
      .empty,
      .error {
        animation: cardIn 180ms ease-out;
      }

      @media (max-width: 640px) {
        .wrap {
          width: min(100%, calc(100% - 20px));
          padding-top: 12px;
        }

        .hero {
          padding: 18px;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="hero">
        <div class="hero-top">
          <div class="eyebrow">Local Network</div>
          <div class="stats" id="stats">
            <div class="stat">Loading</div>
          </div>
        </div>
        <div>
          <h1>Service Dashboard</h1>
          <p class="subtitle">Published Docker services on <strong>m920q.local</strong>.</p>
        </div>
      </section>
      <div class="search-wrap">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" class="search-input" id="searchInput" placeholder="Search services…" autocomplete="off" spellcheck="false">
      </div>
      <section id="services" class="grid" aria-live="polite"></section>
    </main>

    <script>
      const servicesRoot = document.getElementById("services");
      const statsRoot = document.getElementById("stats");
      const searchInput = document.getElementById("searchInput");
      const isFilePreview = window.location.protocol === "file:";
      let allServices = null;

      const demoConfig = {
        defaultHost: "m920q.local",
        services: [
          {
            name: "portainer",
            port: 9443,
            host: "m920q.local",
            protocol: "https",
            path: "",
            description: "portainer/portainer-ce:lts",
          },
          {
            name: "filebrowser",
            port: 8080,
            host: "m920q.local",
            protocol: "http",
            path: "",
            description: "docker.io/filebrowser/filebrowser:latest",
          },
          {
            name: "headplane",
            port: 3000,
            host: "m920q.local",
            protocol: "http",
            path: "",
            description: "ghcr.io/tale/headplane:0.6.2",
          },
        ],
      };

      function matchesQuery(service, query) {
        if (!query) return true;
        const q = query.toLowerCase();
        return (
          service.name.toLowerCase().includes(q) ||
          (service.description || "").toLowerCase().includes(q) ||
          (service.host || "").toLowerCase().includes(q) ||
          String(service.port).includes(q)
        );
      }

      function buildUrl(service, defaultHost) {
        const protocol = service.protocol || "http";
        const host = service.host || defaultHost;
        const path = service.path || "";
        return `${protocol}://${host}:${service.port}${path}`;
      }

      function renderStats(services, defaultHost) {
        const hosts = new Set(
          services.map((service) => service.host || defaultHost).filter(Boolean)
        );

        statsRoot.innerHTML = `
          <div class="stat">${services.length} service${services.length === 1 ? "" : "s"}</div>
          <div class="stat">${hosts.size} host${hosts.size === 1 ? "" : "s"}</div>
        `;
      }

      function renderServices(config) {
        const services = Array.isArray(config.services) ? config.services : [];
        const hosts = new Set(
          services.map((service) => service.host || config.defaultHost).filter(Boolean)
        );
        const showHost = hosts.size > 1;
        renderStats(services, config.defaultHost);

        servicesRoot.replaceChildren();

        if (!services.length) {
          const emptyState = document.createElement("div");
          emptyState.className = "empty";
          emptyState.textContent = "No published Docker ports were found.";
          servicesRoot.append(emptyState);
          return;
        }

        const fragment = document.createDocumentFragment();

        services.forEach((service) => {
          const url = buildUrl(service, config.defaultHost);
          const host = service.host || config.defaultHost;

          const card = document.createElement("article");
          card.className = "card";

          const header = document.createElement("div");
          header.className = "card-header";

          const port = document.createElement("div");
          port.className = "port";
          port.textContent = `${service.protocol || "http"}:${service.port}`;
          header.append(port);

          const title = document.createElement("h2");
          title.textContent = service.name;
          header.append(title);

          if (showHost) {
            const hostLine = document.createElement("p");
            hostLine.className = "meta host";
            hostLine.textContent = `${host}${service.path || ""}`;
            header.append(hostLine);
          }

          card.append(header);

          if (service.description) {
            const description = document.createElement("p");
            description.className = "meta image";
            description.textContent = service.description;
            card.append(description);
          }

          const link = document.createElement("a");
          link.className = "link";
          link.href = url;
          link.target = "_blank";
          link.rel = "noreferrer";
          link.textContent = "Open";
          card.append(link);

          fragment.append(card);
        });

        servicesRoot.append(fragment);
      }

      function renderError() {
        statsRoot.innerHTML = '<div class="stat">Unavailable</div>';
        servicesRoot.innerHTML =
          '<div class="error">Could not load the live service list. Check the server logs for details.</div>';
        searchInput.disabled = true;
      }

      function loadServices() {
        if (isFilePreview) {
          allServices = demoConfig;
          filterAndRender();
          searchInput.focus();
          return Promise.resolve();
        }

        return fetch("./services.json")
          .then((response) => {
            if (!response.ok) {
              throw new Error(`Request failed with ${response.status}`);
            }
            return response.json();
          })
          .then((config) => {
            allServices = config;
            filterAndRender();
            searchInput.focus();
          })
          .catch(renderError);
      }

      function filterAndRender() {
        if (!allServices || !Array.isArray(allServices.services)) {
          return;
        }

        const query = searchInput.value.trim();
        const filtered = allServices.services.filter((s) => matchesQuery(s, query));
        const config = { ...allServices, services: filtered };
        renderServices(config);
      }

      searchInput.addEventListener("input", filterAndRender);

      loadServices();

    </script>
  </body>
</html>
